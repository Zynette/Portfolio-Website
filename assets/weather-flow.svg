<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650"><rect width="1200" height="650" fill="#242e32"/><g font-family="Arial,sans-serif" fill="#e4e5de"><text x="65" y="64" font-size="13" letter-spacing="2">AURORA WEATHER / DATA FLOW</text><text x="65" y="143" font-size="44" letter-spacing="-1">From a city name to hourly rows.</text><rect x="65" y="205" width="510" height="115" fill="none" stroke="#e4e5de" stroke-opacity=".5"/><text x="88" y="234" font-size="11" letter-spacing="1">01</text><text x="88" y="267" font-size="25">Search for a city</text><text x="88" y="296" font-size="15">Open-Meteo geocoding returns possible places</text><rect x="615" y="205" width="510" height="115" fill="none" stroke="#e4e5de" stroke-opacity=".5"/><text x="638" y="234" font-size="11" letter-spacing="1">02</text><text x="638" y="267" font-size="25">Select coordinates</text><text x="638" y="296" font-size="15">A chosen result supplies latitude and longitude</text><rect x="65" y="355" width="510" height="115" fill="none" stroke="#e4e5de" stroke-opacity=".5"/><text x="88" y="384" font-size="11" letter-spacing="1">03</text><text x="88" y="417" font-size="25">Request the forecast</text><text x="88" y="446" font-size="15">Hourly temperature; optional precipitation</text><rect x="615" y="355" width="510" height="115" fill="none" stroke="#e4e5de" stroke-opacity=".5"/><text x="638" y="384" font-size="11" letter-spacing="1">04</text><text x="638" y="417" font-size="25">Render the response</text><text x="638" y="446" font-size="15">Loading, error and hourly display states</text><path d="M575 262h40m-12-8 12 8-12 8 M870 320v17H320v18m-8-12 8 12 8-12 M575 412h40m-12-8 12 8-12 8" fill="none" stroke="#e4e5de"/><text x="65" y="582" font-size="14">SOURCE-DERIVED DIAGRAM · NO LIVE WEATHER OR NATIVE-DEVICE TEST CLAIMED</text><text x="65" y="612" font-size="11" letter-spacing="1.5">ANTONETTE PETALLO / SELECTED WORK</text></g></svg>